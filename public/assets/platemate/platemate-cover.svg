<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">PlateMate — Host &amp; Taste</title>
  <desc id="description">Aperçu graphique rouge et crème de la plateforme de repas chez l’habitant PlateMate.</desc>
  <rect width="1600" height="900" rx="38" fill="#d9251b"/>
  <circle cx="1450" cy="110" r="220" fill="#f8d249" opacity=".95"/>
  <circle cx="115" cy="795" r="190" fill="#6d9f58" opacity=".9"/>
  <g fill="#fff7e8">
    <rect x="90" y="85" width="1420" height="110" rx="24"/>
    <rect x="90" y="250" width="650" height="540" rx="28"/>
    <rect x="790" y="250" width="720" height="250" rx="28"/>
    <rect x="790" y="540" width="345" height="250" rx="28"/>
    <rect x="1165" y="540" width="345" height="250" rx="28"/>
  </g>
  <g fill="#17120f" font-family="Arial, sans-serif">
    <text x="145" y="156" font-size="56" font-weight="900">PlateMate</text>
    <text x="1190" y="150" font-size="25" font-weight="800" letter-spacing="4">HOST &amp; TASTE</text>
    <text x="145" y="350" font-size="32" font-weight="800">PARTAGEZ PLUS QU’UN REPAS</text>
    <text x="145" y="405" font-size="22">Découvrez des tables locales, rencontrez</text>
    <text x="145" y="440" font-size="22">des hôtes passionnés et réservez votre place.</text>
  </g>
  <g transform="translate(180 505)" fill="none" stroke="#d9251b" stroke-linecap="round" stroke-linejoin="round" stroke-width="18">
    <circle cx="150" cy="110" r="105"/>
    <circle cx="150" cy="110" r="54"/>
    <path d="M0 5v210M55 5v210M0 70h55M310 5v210M265 5v80c0 45 90 45 90 0V5"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="840" y="325" fill="#17120f" font-size="24" font-weight="800">EXPLOREZ DES TABLES UNIQUES</text>
    <rect x="840" y="365" width="205" height="72" rx="36" fill="#d9251b"/>
    <text x="890" y="410" fill="#fff7e8" font-size="22" font-weight="800">EXPLORER</text>
    <text x="835" y="615" fill="#17120f" font-size="24" font-weight="800">RÉSERVEZ</text>
    <text x="835" y="653" fill="#17120f" font-size="19">Un parcours simple</text>
    <text x="835" y="685" fill="#17120f" font-size="19">et accessible.</text>
    <text x="1210" y="615" fill="#17120f" font-size="24" font-weight="800">DEVENEZ HÔTE</text>
    <text x="1210" y="653" fill="#17120f" font-size="19">Imaginez votre menu,</text>
    <text x="1210" y="685" fill="#17120f" font-size="19">ouvrez votre table.</text>
  </g>
  <rect x="1315" y="744" width="130" height="36" rx="18" fill="#f8d249"/>
  <text x="1340" y="769" fill="#17120f" font-family="Arial, sans-serif" font-size="17" font-weight="900">EN COURS</text>
</svg>
